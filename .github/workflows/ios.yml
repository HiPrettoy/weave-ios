name: Build unsigned IPA

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  # 合并之前就跑一遍：原来唯一的闸门是推上去之后，编译错误要等 CI 失败才发现，
  # 于是 master 上经常出现「红的」提交（历史上有两次就是 CaptureView 编译错误）。
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version:
        description: "可选：覆盖版本号。留空则用 project.yml 的 MARKETING_VERSION（推荐留空）"
        required: false
        default: ""

# 同一分支/同一 tag 的新推送取消旧构建，避免排队烧 macos 分钟
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 单测跑在模拟器上，比 archive 快得多，所以放在前面：
  # 逻辑错误在 1 分钟内就能看到，不用等 40 分钟的打包。
  test:
    name: Unit tests
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run tests
        run: |
          set -o pipefail
          # 先列出可用模拟器，设备名变了（Apple 每代换名字）时日志里能直接看到该改成什么
          xcrun simctl list devices available | sed -n '1,40p'
          xcodebuild test \
            -project Weave.xcodeproj \
            -scheme Weave \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO

  # 风格检查只报告不拦路：存量代码还没清理完，
  # 现在就把 warning 当 error 会让所有人都在修格式而不是写功能。
  lint:
    name: SwiftLint (advisory)
    runs-on: macos-15
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: |
          if ! command -v swiftlint >/dev/null 2>&1; then
            brew install swiftlint
          fi
          swiftlint version

      - name: Lint
        run: swiftlint lint --quiet --reporter github-actions-logging

  build:
    name: Archive & package
    needs: test
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build & archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Weave.xcodeproj \
            -scheme Weave \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/Weave.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO

      - name: Resolve & verify version
        id: version
        env:
          # 通过 env 传入而不是直接 ${{ }} 插进脚本，避免手动触发时输入被当成 shell 执行
          VERSION_OVERRIDE: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          APP_PATH="build/Weave.xcarchive/Products/Applications/Weave.app"
          test -d "$APP_PATH"
          BUILT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Info.plist")

          # 单一真源：project.yml 的 MARKETING_VERSION。
          # 产物版本和它不一致就说明有人手改了工程或 Info.plist，直接失败。
          DECLARED=$(awk -F'"' '/^[[:space:]]*MARKETING_VERSION:/ { print $2; exit }' project.yml)
          if [ -z "$DECLARED" ]; then
            echo "::error::project.yml 里找不到 MARKETING_VERSION"
            exit 1
          fi
          if [ "$BUILT" != "$DECLARED" ]; then
            echo "::error::产物版本 ($BUILT) != project.yml 的 MARKETING_VERSION ($DECLARED)"
            exit 1
          fi

          # 手动触发时的显式覆盖仅用于补包，且同样必须一致，否则 TrollStore 会判成旧包。
          if [ -n "${VERSION_OVERRIDE:-}" ] && [ "$VERSION_OVERRIDE" != "$BUILT" ]; then
            echo "::error::手动输入版本 ($VERSION_OVERRIDE) != 产物版本 ($BUILT)"
            exit 1
          fi

          # tag 推送（v1.0.20）必须与产物版本一致，否则 Release 会挂错版本号。
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$BUILT" ]; then
              echo "::error::tag ($GITHUB_REF_NAME) != 产物版本 ($BUILT)"
              exit 1
            fi
          fi

          echo "version=$BUILT" >> "$GITHUB_OUTPUT"
          echo "版本校验通过：$BUILT"

      - name: Package Payload into IPA
        id: package
        run: |
          set -euo pipefail
          APP_PATH="build/Weave.xcarchive/Products/Applications/Weave.app"
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          # 清掉可能残留的签名，交给 TrollStore / 侧载工具重新签
          rm -rf build/Payload/Weave.app/_CodeSignature || true
          cd build
          # -X 不写额外的扩展属性/资源叉，避免某些侧载工具解压出错
          zip -qrX "Weave-v${VERSION}.ipa" Payload
          ls -lh "Weave-v${VERSION}.ipa"
          echo "ipa=build/Weave-v${VERSION}.ipa" >> "$GITHUB_OUTPUT"
          echo "name=Weave-v${VERSION}.ipa" >> "$GITHUB_OUTPUT"

      - name: Upload IPA
        # PR 只验证「编得过」，不产出安装包：既省 artifact 配额，
        # 也避免把未发版的包当成可分发产物。
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: weave-unsigned-ipa
          path: ${{ steps.package.outputs.ipa }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build/Logs
            ~/Library/Logs/xcodebuild
          if-no-files-found: ignore

  # 推 tag 即发版：git tag v1.0.20 && git push --tags
  # 版本一致性在上面 build 的 verify 步骤里已经断言过，这里直接消费产物。
  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: weave-unsigned-ipa
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 织识 Weave ${{ github.ref_name }}（未签名 IPA）
          body: |
            未签名 IPA，用 TrollStore 或自签工具安装。

            - 版本：`${{ github.ref_name }}`（与 `project.yml` 的 `MARKETING_VERSION` 一致）
            - 构建：GitHub Actions `${{ github.run_id }}`，Xcode 16.4 / iOS 18.5 SDK
            - 安装：见仓库 `HANDOVER.md` §3.2
          files: dist/*.ipa
          fail_on_unmatched_files: true
          generate_release_notes: true
